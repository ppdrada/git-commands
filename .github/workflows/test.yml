name: test

on:
  push:
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configura o git
        shell: bash
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com

      - name: Testes com o bash do macOS (3.2)
        if: runner.os == 'macOS'
        shell: bash
        run: /bin/bash tests/run.sh

      - name: Testes (com o agendador de verdade)
        if: runner.os != 'macOS'
        shell: bash
        env:
          GIT_COMMANDS_TEST_REAL_SCHEDULE: "1"
        run: bash tests/run.sh

  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instala o Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Valida o marketplace e o plugin
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/git-commands --strict
